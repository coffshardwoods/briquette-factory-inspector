<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Briquette Factory Inspector</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#163d30"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="./icon-192.png">
<style>body{font:16px system-ui;background:#f4f6f5;color:#183027;margin:0}header{background:#163d30;color:white;padding:18px}main{max-width:800px;margin:auto;padding:16px}section{background:white;border-radius:12px;padding:16px;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;box-sizing:border-box;max-width:100%}input,textarea,select{width:100%;border:1px solid #bbb;border-radius:7px;margin:5px 0 12px}button{background:#176348;color:white;border:0;border-radius:8px;margin:4px;cursor:pointer}label{display:block;font-weight:600}small{color:#52665b}.item{border-top:1px solid #ddd;padding:14px 0}.item img{max-width:140px;margin:4px}.row{display:flex;gap:8px;flex-wrap:wrap}h2{margin-bottom:8px}</style>
<header><h1>Briquette Factory Inspector</h1><div>Offline inspection records • prototype</div></header><main>
<section><label>Manufacturer / visit</label><select id="visits"></select><div class="row"><button id="add">+ New visit</button><button id="delete" style="background:#9c3030">Delete selected visit</button><button id="export">Backup JSON (including photos)</button><label style="display:inline">Restore backup <input type="file" id="restore" accept=".json" style="width:180px"></label></div><small>Back up after each visit. Browser data can be cleared by iOS.</small></section>
<section id="details"></section><div id="questions"></div><section><h2>Post-visit assessment</h2><label>Strengths</label><textarea data-field="strengths"></textarea><label>Concerns / red flags</label><textarea data-field="concerns"></textarea><label>Follow-up questions</label><textarea data-field="followup"></textarea><label>Overall recommendation</label><select data-field="recommendation"><option value="">Select</option><option>Shortlist</option><option>Needs follow-up</option><option>Reject</option></select><button id="print">Print / Save as PDF</button></section>
</main><script>
const groups={
'Factory and machine':['Manufacturer identity and factory ownership verified','Model, serial number and manufacturing location','Machine dimensions, weight and frame/weld quality','Motor brand, rating, voltage and frequency','Electrical cabinet, wiring, safety guards and emergency stops','Screw, die and bearing materials / build quality'],
'Feedstock and preparation':['Suitable hardwood species confirmed','Required particle size (mm)','Acceptable moisture range (%)','Feed mechanism and bridging prevention','Drying, screening and hammer milling requirements'],
'Live demonstration':['Feedstock species and moisture measured','Demonstration duration and sustained operation','Actual kilograms produced and measured kg/hour','Power consumption under load (kW)','Briquette diameter, hole and dimensions','Briquette density, cracking and durability','Machine vibration, noise and operating temperature','Start-up, shutdown and jam recovery'],
'Maintenance and commercial':['Screw and die replacement interval (hours)','Spare screw, die and bearing prices','Parts lead time and Australian availability','Warranty terms and exclusions','Installation, training and remote support','Quoted price, Incoterms, freight and payment terms','Lead time, electrical compliance and documentation'],
'Phase two production line':['Full line capacity and bottlenecks','Drying system heat source and energy use','Dust extraction and fire protection','Packaging and material handling','Site footprint and staffing needs']};
const key='briquette-inspector-v1';let db,records=[],active;
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
const request=indexedDB.open(key,1);request.onupgradeneeded=e=>{const d=e.target.result;d.createObjectStore('visits',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'})};request.onsuccess=async()=>{db=request.result;records=await all('visits');if(!records.length)await newVisit();else{active=records[0].id;render()}};
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function importBackup(visits,photos){return new Promise((ok,no)=>{let transaction=db.transaction(['visits','photos'],'readwrite');transaction.oncomplete=ok;transaction.onerror=()=>no(transaction.error||Error('Could not save backup'));transaction.onabort=()=>no(transaction.error||Error('Backup import was cancelled'));for(let visit of visits)transaction.objectStore('visits').put(visit);for(let photo of photos)transaction.objectStore('photos').put(photo)})}
function all(store){return new Promise((ok,no)=>{let r=tx(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function put(store,obj){return new Promise((ok,no)=>{let r=tx(store,'readwrite').put(obj);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function current(){return records.find(x=>x.id===active)}
async function save(){await put('visits',current())}
async function newVisit(){let x={id:uid(),manufacturer:'New manufacturer',date:new Date().toISOString().slice(0,10),model:'',contact:'',phase:'Phase one',answers:{},strengths:'',concerns:'',followup:'',recommendation:''};records.unshift(x);active=x.id;await put('visits',x);render()}
document.getElementById('add').onclick=newVisit;
async function deleteVisit(){const v=current();if(!v)return;if(!confirm('Permanently delete the visit for "'+v.manufacturer+'" ('+v.date+') and all its attached photos? This cannot be undone.'))return;try{const photos=(await all('photos')).filter(p=>p.visitId===v.id);await new Promise((ok,no)=>{const transaction=db.transaction(['visits','photos'],'readwrite');transaction.oncomplete=ok;transaction.onerror=()=>no(transaction.error||Error('Delete failed'));transaction.onabort=()=>no(transaction.error||Error('Delete cancelled'));transaction.objectStore('visits').delete(v.id);for(const p of photos)transaction.objectStore('photos').delete(p.id)});records=records.filter(r=>r.id!==v.id);if(records.length){active=records[0].id;render()}else await newVisit()}catch(err){alert('Could not delete visit: '+err.message)}}
document.getElementById('delete').onclick=deleteVisit;

function render(){let v=current();document.getElementById('visits').innerHTML=records.map(r=>`<option value="${r.id}">${escapeHtml(r.manufacturer)} — ${escapeHtml(r.date)}</option>`).join('');document.getElementById('visits').value=active;
document.getElementById('details').innerHTML='<h2>Visit details</h2>'+[['manufacturer','Manufacturer'],['date','Visit date'],['model','Machine model'],['contact','Contact'],['phase','Project phase']].map(([k,l])=>`<label>${l}</label>${k==='phase'?`<select data-field="${k}"><option>Phase one</option><option>Phase two</option></select>`:`<input data-field="${k}" type="${k==='date'?'date':'text'}">`}`).join('');
document.getElementById('questions').innerHTML=Object.entries(groups).map(([g,qs])=>`<section><h2>${g}</h2>${qs.map((q,i)=>{let id=g+'-'+i;return `<div class="item"><strong>${escapeHtml(q)}</strong><label>Status</label><select data-question="${escapeHtml(id)}" data-prop="status"><option value="">Not checked</option><option>Pass</option><option>Concern</option><option>Not applicable</option></select><label>Manufacturer answer / observed result</label><textarea data-question="${escapeHtml(id)}" data-prop="note"></textarea><label>Attach photograph <input type="file" accept="image/*" capture="environment" data-photo="${escapeHtml(id)}"></label><div class="photos" data-photos="${escapeHtml(id)}"></div></div>`}).join('')}</section>`).join('');
document.querySelectorAll('[data-field]').forEach(el=>el.value=v[el.dataset.field]||'');document.querySelectorAll('[data-question]').forEach(el=>el.value=(v.answers[el.dataset.question]||{})[el.dataset.prop]||'');loadPhotos()}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('visits').onchange=e=>{active=e.target.value;render()};
document.addEventListener('change',async e=>{let t=e.target,v=current();if(t.dataset.field){v[t.dataset.field]=t.value;await save();if(['manufacturer','date'].includes(t.dataset.field))document.getElementById('visits').selectedOptions[0].textContent=v.manufacturer+' — '+v.date}if(t.dataset.question){let a=v.answers[t.dataset.question]||{};a[t.dataset.prop]=t.value;v.answers[t.dataset.question]=a;await save()}if(t.dataset.photo&&t.files[0]){let f=t.files[0];await put('photos',{id:uid(),visitId:active,question:t.dataset.photo,name:f.name,type:f.type,blob:f,created:new Date().toISOString()});loadPhotos();t.value=''}});
document.addEventListener('input',async e=>{let t=e.target;if(t.matches('textarea[data-question],textarea[data-field]')){let v=current();if(t.dataset.field)v[t.dataset.field]=t.value;else{v.answers[t.dataset.question]??={};v.answers[t.dataset.question][t.dataset.prop]=t.value}await save()}});
let photoUrls=[];
async function loadPhotos(){let visitId=active,ps=(await all('photos')).filter(p=>p.visitId===visitId);if(visitId!==active)return;photoUrls.forEach(URL.revokeObjectURL);photoUrls=[];document.querySelectorAll('[data-photos]').forEach(el=>{el.replaceChildren();ps.filter(p=>p.question===el.dataset.photos).forEach(p=>{let a=document.createElement('a'),url=URL.createObjectURL(p.blob);photoUrls.push(url);a.href=url;a.target='_blank';a.rel='noopener';let im=document.createElement('img');im.src=url;im.alt=p.name;a.append(im);el.append(a)})})}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function base64(blob){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)})}
document.getElementById('export').onclick=async()=>{let photos=await all('photos');let packed=await Promise.all(photos.map(async p=>({...p,blob:await base64(p.blob)})));download(new Blob([JSON.stringify({version:1,visits:records,photos:packed})],{type:'application/json'}),'briquette-inspections-backup.json')};
document.getElementById('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.visits)||!data.visits.length||!Array.isArray(data.photos)||!data.visits.every(v=>v&&typeof v.id==='string'&&typeof v.manufacturer==='string'&&v.answers&&typeof v.answers==='object')||!data.photos.every(p=>p&&typeof p.id==='string'&&typeof p.visitId==='string'&&typeof p.question==='string'&&typeof p.blob==='string'&&/^data:image\/[a-z0-9.+-]+;base64,/i.test(p.blob)))throw Error('Invalid backup');if(!confirm('Import visits and photos from this backup?'))return;let photos=await Promise.all(data.photos.map(async p=>({...p,blob:await(await fetch(p.blob)).blob()})));await importBackup(data.visits,photos);records=await all('visits');active=data.visits[0].id;render();alert('Backup imported')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};
document.getElementById('print').onclick=()=>window.print();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></html>
